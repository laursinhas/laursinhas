name: Atualizar README
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_readme.py
      - run: |
          git config user.name "laursinhas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "atualiza clima"
          git push
